<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>ASSASSIN PERSIAN</title>

<meta name="description"
      content="شعر، همدلی، کمک مردمی و گفت‌وگو">

<link rel="stylesheet" href="style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;500;600;700&family=Noto+Nastaliq+Urdu:wght@400;500;600&display=swap"
      rel="stylesheet">

<style>

:root{
  --gold:#f3cf55;
  --gold2:#c89d24;
  --red:#6b101b;
  --red2:#2a050a;
  --black:#020202;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:"Noto Naskh Arabic",Tahoma,Arial,sans-serif;
  background:#000;
  color:#fff;
  overflow-x:hidden;
}

body:before{
  content:"";
  position:fixed;
  inset:0;
  z-index:-3;
  background:
    linear-gradient(
      90deg,
      rgba(0,0,0,.84),
      rgba(35,0,5,.42)
    ),
    url("background.png") center/cover no-repeat;
}

body:after{
  content:"";
  position:fixed;
  inset:0;
  z-index:-2;
  pointer-events:none;

  background:
    radial-gradient(
      circle at 50% 25%,
      rgba(255,210,70,.07),
      transparent 35%
    );
}

/* CREATOR */

.creator{
  text-align:center;
  padding-top:75px;
  padding-bottom:10px;
  background:rgba(0,0,0,.75);
}

.creator-img{
  width:90px;
  height:90px;
  border-radius:50%;
  object-fit:cover;
  border:3px solid gold;
}

.creator{
  font-size:20px;
  font-weight:bold;
  color:gold;
}

.creator span{
  font-size:14px;
  color:white;
}

/* HEADER */

header{
  height:58px;

  position:fixed;
  top:0;
  left:0;
  right:0;

  z-index:50;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 3%;

  background:rgba(0,0,0,.90);

  border-bottom:
    1px solid rgba(243,207,85,.45);

  backdrop-filter:blur(10px);
}

.logo{
  font-family:Georgia,serif;
  font-size:25px;
  letter-spacing:1px;
  color:var(--gold);
  direction:ltr;
}

nav{
  display:flex;
  gap:8px;
}

nav a{
  color:#fff;
  text-decoration:none;

  padding:9px 14px;

  border-radius:6px;

  font-size:14px;

  transition:.2s;
}

nav a:hover,
nav a.active{
  color:#111;
  background:var(--gold);
}

/* MAIN */

main{
  padding-top:58px;
}

.screen{
  min-height:calc(100vh - 58px);

  display:none;

  padding:22px 1.5%;

  align-items:center;
  justify-content:center;
}

.screen.active{
  display:flex;
  animation:in .45s ease;
}

@keyframes in{
  from{
    opacity:0;
    transform:translateY(12px);
  }

  to{
    opacity:1;
    transform:none;
  }
}

/* HOME */

.home-card{
  width:100%;
  max-width:1180px;

  min-height:calc(100vh - 105px);

  display:grid;
  grid-template-columns:46% 54%;

  align-items:center;

  border:1px solid var(--gold2);

  background:
    linear-gradient(
      135deg,
      rgba(40,0,5,.88),
      rgba(75,5,12,.72)
    );

  box-shadow:0 0 70px rgba(0,0,0,.7);

  position:relative;

  overflow:hidden;
}

.home-card:before{
  content:"";

  position:absolute;
  inset:10px;

  border:
    1px solid
    rgba(243,207,85,.24);

  pointer-events:none;
}

.art-wrap{
  height:100%;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:30px;
}

.art-wrap img{
  width:min(100%,520px);

  max-height:78vh;

  object-fit:contain;

  filter:drop-shadow(0 16px 35px #000);
}

.poem-wrap{
  text-align:center;

  padding:
    40px
    50px
    40px
    35px;

  position:relative;
}

.poem-wrap:after{
  content:"";

  position:absolute;

  left:0;
  right:0;

  bottom:14%;

  height:1px;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(243,207,85,.55),
      transparent
    );
}

.poem{
  font-family:
    "Noto Nastaliq Urdu",
    "Noto Naskh Arabic",
    serif;

  color:#ffe57a;

  font-size:
    clamp(28px,3.4vw,48px);

  line-height:2.05;

  text-shadow:0 3px 15px #000;

  white-space:pre-line;

  margin-bottom:24px;
}

.ornament{
  color:var(--gold);

  font-size:27px;

  letter-spacing:12px;

  margin:8px 0;
}

.translation{
  direction:ltr;

  text-align:center;

  color:#f5e9bb;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:
    clamp(16px,1.65vw,22px);

  line-height:1.8;

  max-width:700px;

  margin:auto;
}

.patriot{
  margin-top:30px;

  color:#ffe17a;

  font-size:
    clamp(18px,2vw,27px);

  font-weight:700;
}

.home-actions{
  margin-top:30px;

  display:flex;

  justify-content:center;

  gap:12px;

  flex-wrap:wrap;
}

/* BUTTON */

.btn{
  border:
    1px solid var(--gold);

  background:
    linear-gradient(
      135deg,
      #8e202d,
      #4b0a12
    );

  color:#fff;

  padding:11px 25px;

  border-radius:8px;

  font:inherit;

  font-weight:700;

  cursor:pointer;

  text-decoration:none;

  transition:.2s;
}

.btn:hover{
  transform:translateY(-2px);

  box-shadow:
    0 8px 28px
    rgba(243,207,85,.18);
}

.btn.secondary{
  background:transparent;
  color:var(--gold);
}

/* PANEL */

.panel{
  width:min(900px,100%);

  background:rgba(3,3,3,.91);

  border:
    1px solid
    rgba(243,207,85,.5);

  border-radius:10px;

  padding:30px;

  box-shadow:
    0 25px 80px #000;
}

.title{
  text-align:center;

  color:var(--gold);

  font-size:34px;

  margin-bottom:7px;
}

.sub{
  text-align:center;

  color:#aaa;

  line-height:1.9;

  margin-bottom:25px;
}

/* FORM */

.form-grid{
  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:15px;
}

.full{
  grid-column:1/-1;
}

label{
  display:block;

  margin-bottom:6px;

  color:#eee;
}

input,
textarea{
  width:100%;

  background:#0c0c0c;

  border:
    1px solid
    #51323a;

  border-radius:8px;

  padding:12px;

  color:#fff;

  font:inherit;

  outline:none;
}

input:focus,
textarea:focus{
  border-color:var(--gold);
}

textarea{
  min-height:105px;

  resize:vertical;
}

.notice{
  margin:18px 0;

  background:#211014;

  border-right:
    4px solid
    var(--gold);

  padding:13px 16px;

  line-height:1.9;

  color:#ddd;
}

.check{
  display:flex;

  gap:9px;

  align-items:flex-start;

  color:#bbb;

  margin:15px 0;
}

.check input{
  width:auto;

  margin-top:7px;
}

.signature{
  width:100%;

  height:150px;

  background:#fff;

  border-radius:8px;

  touch-action:none;
}

.actions{
  display:flex;

  justify-content:center;

  gap:10px;

  flex-wrap:wrap;

  margin-top:18px;
}

.small{
  color:#aaa;

  font-size:13px;

  text-align:center;

  margin-top:10px;
}

#joinMsg,
#payMsg{
  color:var(--gold);
}

/* GATE */

#gate{
  position:fixed;

  inset:0;

  background:#000;

  z-index:100;

  display:none;

  overflow:hidden;
}

#gate.show{
  display:block;
}

.gate-title{
  position:absolute;

  top:44%;

  left:0;
  right:0;

  text-align:center;

  color:#ddd;

  font-size:20px;

  opacity:0;

  animation:
    textIn .8s .25s forwards;
}

.gate-sub{
  position:absolute;

  top:50%;

  left:0;
  right:0;

  text-align:center;

  color:#777;

  font-size:14px;

  opacity:0;

  animation:
    textIn .8s .4s forwards;
}

@keyframes textIn{
  to{
    opacity:1;
  }
}

.star{
  position:absolute;

  width:3px;
  height:3px;

  border-radius:50%;

  background:#fff;

  box-shadow:
    0 0 16px 6px
    rgba(255,255,255,.9);

  animation:
    star .9s
    cubic-bezier(.2,.9,.2,1)
    forwards;
}

@keyframes star{
  0%{
    transform:scale(0);
    opacity:0;
  }

  35%{
    transform:scale(2.2);
    opacity:1;
  }

  100%{
    transform:scale(1);
    opacity:.95;
  }
}

/* GALAXY */

.galaxy-panel{
  width:min(1100px,100%);

  height:min(82vh,760px);

  background:#000;

  border:
    1px solid
    rgba(243,207,85,.65);

  position:relative;

  overflow:hidden;
}

.galaxy-panel:before{
  content:"";

  position:absolute;

  inset:0;

  background:

    radial-gradient(
      ellipse at 50% 52%,
      rgba(145,88,255,.45) 0 7%,
      rgba(61,31,125,.28) 14%,
      transparent 38%
    ),

    radial-gradient(
      ellipse at 52% 52%,
      rgba(255,180,90,.28) 0 3%,
      transparent 25%
    ),

    radial-gradient(
      circle at 12% 20%,
      #fff 0 1px,
      transparent 1.5px
    ),

    radial-gradient(
      circle at 73% 14%,
      #fff 0 1px,
      transparent 1.5px
    );

  background-size:
    auto,
    auto,
    120px 120px,
    170px 170px;

  opacity:.95;
}

.galaxy-title{
  position:relative;

  z-index:2;

  text-align:center;

  color:var(--gold);

  font-size:27px;

  padding-top:28px;
}

.counter{
  position:absolute;

  z-index:4;

  left:50%;
  top:50%;

  transform:
    translate(-50%,-50%);

  text-align:center;
}

.counter strong{
  display:block;

  font-family:Georgia,serif;

  font-size:
    clamp(65px,10vw,120px);

  color:#f5d56a;

  text-shadow:
    0 0 28px
    rgba(243,207,85,.3);
}

.counter span{
  font-size:17px;

  color:#ddd;
}

.gstar{
  position:absolute;

  z-index:2;

  width:2px;
  height:2px;

  background:#fff;

  border-radius:50%;

  box-shadow:0 0 6px #fff;

  animation:
    twinkle 2.3s infinite alternate;
}

@keyframes twinkle{
  to{
    opacity:.3;
    transform:scale(.65);
  }
}

.planet{
  position:absolute;

  left:50%;
  top:50%;

  width:52%;
  height:20%;

  transform:
    translate(-50%,-50%)
    rotate(-12deg);

  border:
    1px solid
    rgba(220,180,255,.18);

  border-radius:50%;

  box-shadow:
    0 0 45px
    rgba(170,100,255,.12);
}

.chat-layout{
  width:min(1050px,100%);

  display:grid;

  grid-template-columns:
